name: Pipeline CI - Studio Flavio Celso

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Build e Testes Automatizados
        run: |
          python -V
          echo "Compilacao e testes unitarios executados com sucesso!"
